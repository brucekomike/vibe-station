name: Deploy Sphinx documentation to GitHub Pages

on:
  push:
    branches:
      - main  # Or your main branch
    paths:
      - 'docs/**'

# needed by the native github-pages method (configure/upload/deploy-pages)
# the old gh-pages branch method only needs: contents: write
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    # env needed only by the old gh-pages branch method:
    #   GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    #   GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.12'  # Or your Python version

      - name: Install dependencies
        run: |
          cd docs
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build Sphinx documentation
        run: |
          cd docs
          make html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build/html

      # --- old method: push build result to gh-pages branch ---
      # - name: GitHub Pages
      #   uses: crazy-max/ghaction-github-pages@v4.1.0
      #   with:
      #       build_dir: docs/build/html

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
